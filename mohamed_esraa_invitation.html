<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100e">
<title>Mohamed & Esraa | Wedding Invitation</title>
<style>
:root{--gold:#d8b56a;--gold2:#f5e4b6;--ink:#100f0d;--muted:#d8cfbd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 15%,#292216 0%,#14120f 43%,#090909 100%);color:#fff;font-family:Georgia,'Times New Roman',serif}
body{display:grid;place-items:center;padding:20px;overflow-x:hidden}.card{position:relative;width:min(100%,520px);min-height:780px;border:1px solid #8f713a;border-radius:4px;padding:38px 24px 28px;text-align:center;overflow:hidden;background:linear-gradient(155deg,rgba(255,255,255,.025),transparent 42%),rgba(8,8,8,.35);box-shadow:0 0 0 7px rgba(216,181,106,.045),0 24px 80px #0008}
.card:before,.card:after{content:"✦";position:absolute;color:var(--gold);font-size:18px;opacity:.75}.card:before{top:17px;right:18px}.card:after{bottom:17px;left:18px}
.frame{position:absolute;inset:12px;border:1px solid rgba(216,181,106,.28);pointer-events:none}.ornament{color:var(--gold);letter-spacing:8px;font-size:13px;animation:fade 1.5s both}.arabic{font-family:Georgia,'Times New Roman',serif;color:var(--gold2);font-size:16px;letter-spacing:1px;margin-top:18px;animation:rise 1s .2s both}.eyebrow{font-size:11px;letter-spacing:5px;color:#c6b17f;margin-top:34px;animation:rise 1s .4s both}.names{font-size:clamp(40px,10vw,58px);line-height:1.12;font-weight:400;color:var(--gold2);margin:28px 0 8px;text-shadow:0 0 22px #d8b56a20;animation:rise 1.25s .8s both}.amp{display:block;font-size:30px;color:var(--gold);margin:3px 0}.rule{height:1px;width:70%;margin:27px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.3s 1.1s both;transform-origin:center}.invite{font-family:Arial,sans-serif;font-size:15px;line-height:2;color:#e5dfd2;max-width:350px;margin:0 auto;animation:rise 1s 1.3s both}.date{margin:28px auto 8px;color:var(--gold2);font-size:22px;letter-spacing:1px;animation:rise 1s 1.5s both}.venue{font-family:Arial,sans-serif;color:#e5dfd2;font-size:15px;margin-top:9px;animation:rise 1s 1.7s both}.venue small{display:block;color:#b8a779;font-size:11px;letter-spacing:3px;margin-bottom:8px}.footer{margin-top:35px;font-family:Arial,sans-serif;color:#c9b783;font-size:12px;animation:fade 1s 2s both}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px;animation:rise 1s 2s both}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid var(--gold);padding:12px 17px;color:var(--gold2);font:13px Arial,sans-serif;background:#18140d;cursor:pointer;transition:background .2s,transform .2s}.btn:hover{background:#332714;transform:translateY(-2px)}.btn.primary{background:linear-gradient(120deg,#b68b3d,#f0d99e);color:#17120a;border-color:#e5c77f}.spark{position:absolute;top:-20px;width:3px;height:3px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px 2px #d8b56a;animation:fall linear infinite;opacity:0}.spark:nth-child(1){left:18%;animation-duration:8s;animation-delay:1s}.spark:nth-child(2){left:78%;animation-duration:10s;animation-delay:3s}.spark:nth-child(3){left:48%;animation-duration:7s;animation-delay:2s}.spark:nth-child(4){left:88%;animation-duration:9s;animation-delay:4s}.spark:nth-child(5){left:30%;animation-duration:11s;animation-delay:0s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}@keyframes fall{0%{transform:translateY(-20px);opacity:0}10%{opacity:.7}90%{opacity:.5}100%{transform:translateY(850px);opacity:0}}
@media(max-height:850px){.card{min-height:0;padding-top:28px;padding-bottom:24px}.eyebrow{margin-top:24px}.names{margin-top:20px}.rule{margin:20px auto}.date{margin-top:20px}.footer{margin-top:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card" aria-label="Wedding invitation">
<div class="frame"></div><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span><span class="spark"></span>
<div class="ornament">✧ ───────── ✧</div>
<div class="arabic">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيم</div>
<div class="eyebrow">TOGETHER WITH THEIR FAMILIES</div>
<h1 class="names">Mohamed <span class="amp">&amp;</span> Esraa</h1>
<div class="rule"></div>
<p class="invite">بكل الحب والفرحة،<br>يسعدنا دعوتكم لمشاركتنا أجمل ليلة في العمر</p>
<div class="date">10 · 11 · 2026</div>
<div class="venue"><small>THE WEDDING CELEBRATION</small>نادي الجلاء</div>
<div class="footer">حضوركم يكمّل فرحتنا ♡</div>
<div class="buttons">
<a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=%D9%86%D8%A7%D8%AF%D9%8A%20%D8%A7%D9%84%D8%AC%D9%84%D8%A7%D8%A1" target="_blank" rel="noopener">⌖ موقع الفرح</a>
<button class="btn" id="share">↗ مشاركة الدعوة</button>
<button class="btn" id="replay">↻ إعادة الحركة</button>
</div>
</main>
<script>
const shareText='دعوة فرح Mohamed & Esraa 💛\n10 نوفمبر 2026\nنادي الجلاء\nيسعدنا حضوركم ومشاركتنا فرحتنا.';
document.getElementById('share').addEventListener('click',async()=>{const data={title:'Mohamed & Esraa — Wedding Invitation',text:shareText,url:location.href};try{if(navigator.share){await navigator.share(data)}else{const url='https://wa.me/?text='+encodeURIComponent(shareText+'\n'+location.href);window.open(url,'_blank','noopener')}}catch(e){if(e.name!=='AbortError')window.open('https://wa.me/?text='+encodeURIComponent(shareText+'\n'+location.href),'_blank','noopener')}});
document.getElementById('replay').addEventListener('click',()=>{document.querySelectorAll('.card .arabic,.eyebrow,.names,.rule,.invite,.date,.venue,.footer,.buttons,.ornament').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation=''});});
</script>
</body>
</html>
